name: SSO Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/Workers/deploy-worker@v1
        with:
          mode: production
          hub-repo: Karasu-Lab/Karasu-Lab
          app-path: apps/sso.karasu256.com
          prepare-command: node {app_path}/scripts/export-public-vars.mjs {env}
          build-command: pnpm --filter sso.karasu256.com build:worker
          deploy-command: pnpm --filter sso.karasu256.com exec wrangler deploy
          preview-command: pnpm --filter sso.karasu256.com exec wrangler preview --env preview --name "{branch}"
          worker-name: sso-karasu256-com

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/Workers/deploy-worker@v1
        with:
          mode: preview
          hub-repo: Karasu-Lab/Karasu-Lab
          app-path: apps/sso.karasu256.com
          prepare-command: node {app_path}/scripts/export-public-vars.mjs {env}
          build-command: pnpm --filter sso.karasu256.com build:worker
          deploy-command: pnpm --filter sso.karasu256.com exec wrangler deploy
          preview-command: pnpm --filter sso.karasu256.com exec wrangler preview --env preview --name "{branch}"
          worker-name: sso-karasu256-com
